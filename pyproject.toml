[project]
name = "busy-time"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["pydantic==2.13.5"]

[project.scripts]
busytime = "busytime.main:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.6", "pre-commit==4.6.2"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.basedpyright]
typeCheckingMode = "strict"
